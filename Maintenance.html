<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Maintenance Fluid Calculator</title>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>
  <nav>
    <ul>
      <li><a href="index.html#home">Home</a></li>
    </ul>
  </nav>

  <div class="container">
    <div class="form-section">
      <h2>Maintenance Fluid Calculator</h2>

      <div class="input-group">
        <h3>Weight (kg)</h3>
        <label>
          <input type="number" id="weightInput" step="0.1" onchange="calculateMaintenanceFluid()" />
        </label>
      </div>
    </div>

    <div class="output-section">
      <div id="maintenanceFluidOutput"></div>
      <button onclick="clearMaintenanceFluid()">Clear</button>
      <button onclick="copyMaintenanceFluid()">Copy to Clipboard</button>
    </div>
  </div>

  <script src="maintenance.js"></script>
</body>
</html>
